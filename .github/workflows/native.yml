name: Native macOS release
on:
  push:
    tags: ['native-v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/build-native.sh
      - run: brew install neovim
      - run: ./tests/run.sh
      - uses: actions/upload-artifact@v4
        with:
          name: native-macos
          path: dist/*
      - name: Publish versioned binaries
        if: startsWith(github.ref, 'refs/tags/native-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes "Universal macOS input-source-switcher binaries. See SOURCE_REVISION and bundled MIT license."
